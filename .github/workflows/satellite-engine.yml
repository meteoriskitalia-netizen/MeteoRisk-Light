name: Satellite Engine — download rolling (6 sorgenti, niente deploy Pages)

# Meteorisk Satellite Engine — ogni 5 minuti riempie la finestra rolling: slot
# corrente + i 24 slot precedenti, per ciascuna delle 6 sorgenti EUMETSAT (WMS
# view.eumetsat.int, 3 Europa + 3 Italia), scaricando solo i frame mancanti
# (backfill), e pubblica la finestra su GitHub Pages tramite il branch
# satellite-cache (force-push di immagini statiche) SENZA build/upload/deploy
# dell'artefatto Pages: la cadenza */5 non dipende piu' dai deploy.
#   - Sorgenti (chiave = sourceId): eumetsat (mtg_fd:ir105_hrfi),
#     eumetsat_airmass (msg_fes:rgb_airmass), eumetsat_geocolour
#     (mtg_fd:rgb_geocolour) + eumetsat_italy / eumetsat_airmass_italy /
#     eumetsat_geocolour_italy (stessi prodotti sul ritaglio Italia).
#   - GetMap IDENTICI a buildEumetsatLiveGetMap dell'app: EPSG:3857 su
#     SATELLITE_EUROPE_BOUNDS [[22,-28],[72,55]] e SATELLITE_ITALY_BOUNDS
#     [[36.5,6.6],[47.2,18.8]], time = ora - EUMETSAT_DATA_LAG_MS (15 min)
#     floor a 5 min (buildSyncTimeline), formato .000Z.
#   - Finestra rolling: 25 slot per sorgente (2 ore a passo 5 min). Pruning e
#     satellite/manifest.json (slot disponibili per sourceId) gestiti dallo
#     script, idempotente: gli slot gia' presenti e validi sono saltati senza
#     richieste (0 se la finestra e' piena, 3 se manca solo lo slot corrente,
#     fino a 75 al primo run).
#   - Persistenza SENZA crescita di history: branch ORPHAN satellite-cache
#     (albero = solo satellite/), commit singola senza parent e force-push ad
#     OGNI run -> history resettata, crescita zero. main NON viene toccato.
#   - Niente deploy Pages in questo workflow: satellite/ arriva su Pages
#     tramite radar-engine.yml / update-weather-data.yml, che dopo il download
#     lo ripristinano da satellite-cache e lo includono nel proprio artifact.
#     Concurrency group PROPRIO "satellite-cache" (cancel-in-progress: false):
#     le run da 5 min non competono piu' con i deploy del group "pages".
#   - Failure policy (valutata sullo slot corrente): rc 0 ok | rc 3 degradato
#     (1-2 sorgenti in errore, comunque atteso) | rc 4 error (nessuna sorgente
#     scaricata) -> failure visibile. I fallimenti sugli slot di backfill sono
#     solo loggati: non cambiano l'exit code.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ci-run]

permissions:
  contents: write

concurrency:
  group: satellite-cache
  cancel-in-progress: false

jobs:
  satellite-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pillow: la ri-codifica PNG -> WebP dei frame (satellite_engine.py)
      # richiede Pillow, installato dal requirements dedicato dello script.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/satellite_engine_requirements.txt

      # La finestra rolling vive nel branch satellite-cache (mai su main):
      # ogni run la ripristina prima del backfill (slot corrente + 24 precedenti).
      - name: Ripristina finestra rolling (branch satellite-cache)
        run: |
          if git fetch --depth 1 origin "+satellite-cache:refs/heads/satellite-cache-base" 2>/dev/null; then
            if git restore --source satellite-cache-base --worktree -- satellite 2>/dev/null; then
              echo "[INFO] Finestra rolling ripristinata da satellite-cache."
            else
              echo "[WARN] satellite-cache esistente senza directory satellite/."
            fi
          else
            echo "[INFO] Branch satellite-cache assente (primo run): finestra vuota."
          fi

      # rc valutati sullo slot corrente: rc 0 ok / rc 3 degradato (1-2 sorgenti
      # in errore, le altre scaricate) -> success; rc 4 error (nessuna sorgente
      # sullo slot corrente) -> failure visibile; i fallimenti di backfill non
      # cambiano l'exit code.
      - name: Download frame EUMETSAT (backfill finestra + slot corrente)
        id: run
        run: |
          rc=0
          python scripts/satellite_engine.py || rc=$?
          echo "engine_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

      # Branch orphan a commit singola (niente parent -> history resettata ad
      # ogni push, crescita zero). Il push va a satellite-cache, mai a main.
      # Il push avviene SOLO se il download e' riuscito (if: success()).
      - name: Aggiorna branch satellite-cache (force-push rolling window)
        if: success()
        run: |
          set -euo pipefail
          if [ ! -d satellite ]; then
            echo "[INFO] Nessuna directory satellite: cache non aggiornata."
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/satellite-cache.index"
          git read-tree --empty
          git add -f satellite/
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          OLD=""
          if git rev-parse -q --verify satellite-cache-base >/dev/null; then
            OLD=$(git rev-parse satellite-cache-base^{tree})
          fi
          if [ "$OLD" = "$TREE" ]; then
            echo "[INFO] Nessuna modifica alla finestra rolling: push saltato."
            exit 0
          fi
          COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$TREE" -m "[skip ci] satellite: rolling window (6 sorgenti)")
          for attempt in 1 2 3; do
            if git push --force origin "$COMMIT:refs/heads/satellite-cache"; then
              echo "[INFO] satellite-cache aggiornata (commit ${COMMIT:0:7})."
              exit 0
            fi
            echo "[WARN] push satellite-cache fallito (tentativo $attempt/3): riprovo."
            sleep $((attempt * 5))
          done
          echo "[ERRORE] push satellite-cache fallito dopo 3 tentativi."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "engine rc: \`${{ steps.run.outputs.engine_rc || 'n/a' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"